<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Product Catalog</title>
   <link rel="stylesheet" href="css/styles.css">
   <!-- Link to external CSS -->
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">
            <h1>Admin Dashboard</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="admin.html">Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <!-- Dashboard Summary -->
    <section id="dashboard-summary">
        <h2>Dashboard Summary</h2>
        <p><strong>Total Products:</strong> 100</p>
    </section>

    <!-- Add New Product -->
    <section id="add-product">
        <h2>Add New Product</h2>
        <form>
            <label for="product-name">Product Name:</label>
            <input type="text" id="product-name" name="product-name" required>
            
            <label for="product-price">Price:</label>
            <input type="number" id="product-price" name="product-price" required>
            
            <label for="product-category">Category:</label>
            <select id="product-category" name="product-category">
                <option value="electronics">Electronics</option>
                <option value="fashion">Fashion</option>
                <option value="home-garden">Home & Garden</option>
                <option value="sports">Sports</option>
            </select>
            
            <label for="product-description">Description:</label>
            <textarea id="product-description" name="product-description" required></textarea>
            
            <label for="product-stock">Stock:</label>
            <input type="number" id="product-stock" name="product-stock" required>
            
            <button type="submit">Add Product</button>
        </form>
    </section>

    <!-- Product Management Table -->
    <section id="product-management">
        <h2>Manage Products</h2>
        <table>
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Category</th>
                    <th>Stock</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Example product row -->
                <tr>
                    <td>Product 1</td>
                    <td>$19.99</td>
                    <td>Electronics</td>
                    <td>50</td>
                    <td>
                        <button>Edit</button>
                        <button>Delete</button>
                    </td>
                </tr>
                <!-- Add more rows as needed -->
            </tbody>
        </table>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2023 Product Catalog. All rights reserved.</p>
    </footer>
</body>
</html>
